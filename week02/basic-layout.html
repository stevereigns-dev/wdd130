<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Stephen Adjei Amponsah">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="/images/basic-logo.png" alt="sample html learning logo" width="128" height="128">
    </header>
    <nav>
       <ul>
        <li>
            <a href="#contact">Contact</a>
        </li>
        <li>
            <a href="#about">About</a>
        </li>
       </ul> 
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorum ratione repellendus nobis.</p>
        </section>
        <section>
            <h2>Heading 2</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque, quasi unde.</p>
        </section>
        <aside>
            <img src="https://www.churchofjesuschrist.org/temples/photo-gallery" width="200" alt="A temple of Church of Jesus Christ">
        </aside>
        <footer>
            <p>Stephen Adjei Amponsah</p>
        </footer>
    </main>
</body>

</html>
